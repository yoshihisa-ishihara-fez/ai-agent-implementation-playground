services:
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/chroma/chroma

  agent:
    build: .
    env_file: [.env]
    volumes:
      - ./:/app
      - /app/node_modules
    tty: true
    stdin_open: true
    depends_on:
      - chromadb
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000

volumes:
  chroma-data:
